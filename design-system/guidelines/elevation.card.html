<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}</style></head><body>
<div style="display:flex;gap:18px;padding:24px">
<div style="width:200px;height:86px;border-radius:10px;background:var(--surface-card);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font:var(--type-meta);color:var(--text-secondary)">--shadow-card</div>
<div style="width:200px;height:86px;border-radius:10px;background:var(--surface-card);box-shadow:var(--ring-default);display:flex;align-items:center;justify-content:center;font:var(--type-meta);color:var(--text-secondary)">--ring-default</div>
<div style="width:200px;height:86px;border-radius:10px;background:var(--surface-card);box-shadow:var(--ring-brand);display:flex;align-items:center;justify-content:center;font:var(--type-meta);color:var(--text-secondary)">--ring-brand</div>
</div>
</body></html>
