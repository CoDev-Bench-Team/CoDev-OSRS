<!-- @dsCard group="Brand" viewport="700x170" name="Status vocabulary" subtitle="The exact labels the pipeline uses" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}</style></head><body>
<div style="display:flex;gap:10px;padding:22px;flex-wrap:wrap">
<span style="border-radius:999px;padding:6px 10px;background:var(--status-pending-bg);color:var(--status-pending-fg);font:var(--type-pill)">Pending Approval</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">Approved</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">For Release</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">Ready for Pickup</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">For Delivery</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">Released</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">Completed</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-rejected-bg);color:var(--status-rejected-fg);font:var(--type-pill)">Rejected</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-ready-bg);color:var(--status-ready-fg);font:var(--type-pill)">In Stock</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-pending-bg);color:var(--status-pending-fg);font:var(--type-pill)">Low Stock</span><span style="border-radius:999px;padding:6px 10px;background:var(--status-rejected-bg);color:var(--status-rejected-fg);font:var(--type-pill)">Out of Stock</span>
</div>
</body></html>
